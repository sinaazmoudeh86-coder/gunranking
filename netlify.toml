[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Image CDN: lets /.netlify/images resize GrabAGun product photos (window.GR_RS in gunranking-data.js).
[images]
  remote_images = ["https://nip\\.grabagun\\.org/.*", "https://.*\\.wikimedia\\.org/.*", "https://grabagun\\.com/media/.*"]
